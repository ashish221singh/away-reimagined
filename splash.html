<script type="module">
import * as THREE from 'three';

/* ---------- background shader ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setClearColor(0x141317, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { uTime:{value:0}, uRes:{value:new THREE.Vector2(1,1)} };

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv; uniform float uTime; uniform vec2 uRes;
    vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x,289.0); }
    float snoise(vec2 v){
      const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
      vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
      vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod(i,289.0);
      vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
      vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
      m=m*m; m=m*m; vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5;
      vec3 ox=floor(x+0.5); vec3 a0=x-ox;
      m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
      vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
      return 130.0*dot(m,g);
    }
    float fbm(vec2 x){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*snoise(x); x=x*2.02+7.3; a*=0.5;} return v*0.5+0.5; }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    const vec3 INK0=vec3(0.078,0.075,0.090);
    const vec3 INK1=vec3(0.082,0.082,0.082);
    const vec3 PURPLE=vec3(0.463,0.396,0.906);
    const vec3 PDEEP=vec3(0.424,0.361,0.820);
    const vec3 LAV=vec3(0.584,0.522,0.941);
    void main(){
      vec2 uv=vUv; vec2 asp=vec2(uRes.x/uRes.y,1.0); vec2 p=(uv-0.5)*asp;
      float t=uTime*0.05;
      vec2 q=vec2(fbm(p*1.25+vec2(0.0,t*0.35)), fbm(p*1.25+vec2(4.2,1.3)-t*0.30));
      float warp=fbm(p*1.5+q*0.9+t*0.20);
      vec2 c1=vec2(sin(t*0.55)*0.18, 0.34+cos(t*0.40)*0.10);
      vec2 c2=vec2(-0.20+cos(t*0.36)*0.15, 0.02+sin(t*0.48)*0.12);
      float g1=smoothstep(0.56,0.0,length(p-c1));
      float g2=smoothstep(0.48,0.0,length(p-c2));
      g1=pow(g1,1.7)*(0.45+0.55*warp);
      g2=pow(g2,1.9)*(0.40+0.60*(1.0-warp));
      vec3 col=mix(INK0,INK1,smoothstep(0.0,1.0,uv.y));
      col=mix(col,PDEEP,clamp(g2,0.0,1.0)*0.30);
      col=mix(col,PURPLE,clamp(g1,0.0,1.0)*0.42);
      float core=smoothstep(0.22,0.0,length(p-c1));
      col+=LAV*core*(0.05+0.03*warp);
      float vig=smoothstep(0.98,0.16,length((uv-0.5)*asp*1.15));
      col*=mix(0.34,1.0,vig);
      col*=mix(0.62,1.0,smoothstep(-0.05,0.55,uv.y));
      col+=(hash(uv*uRes+t)-0.5)*0.026;
      gl_FragColor=vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

function resize(){
  const dpr=Math.min(window.devicePixelRatio,2);
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(w,h,false);
  uniforms.uRes.value.set(w*dpr, h*dpr);
}
window.addEventListener('resize', resize); resize();

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const start = performance.now();
renderer.setAnimationLoop(()=>{
  uniforms.uTime.value = reduce ? 8.0 : (performance.now()-start)/1000;
  renderer.render(scene, camera);
});

/* ---------- full flight: glide in from bottom-left -> one clean loop -> glide out top-right ----------
   Driven by ONE linear tween. Position, rotation, scale and opacity are all derived from a single
   parametric path (straight -> exact tangent circle -> straight), so velocity is continuous
   everywhere (no jerk) and the speed is shaped by an arc-length profile we control directly. */
const gsap  = window.gsap;
const stage = document.getElementById('stage');
const plane = document.getElementById('plane');
const jumpToEnd = location.search.indexOf('end') > -1;

// --- vapour contrail on a 2D layer between the aurora and the plane ---
const tcanvas = document.getElementById('trail');
const tctx = tcanvas.getContext('2d');
let tdpr = Math.min(window.devicePixelRatio, 2);
function sizeTrail(){
  tdpr = Math.min(window.devicePixelRatio, 2);
  tcanvas.width  = Math.round(window.innerWidth  * tdpr);
  tcanvas.height = Math.round(window.innerHeight * tdpr);
}
sizeTrail();
window.addEventListener('resize', sizeTrail);
const trail = [];
const TRAIL_SPAN = 0.20;                 // trail lifetime in progress units (~0.7s of soft wake)
function drawTrail(curU){
  tctx.setTransform(1,0,0,1,0,0);
  tctx.clearRect(0,0,tcanvas.width,tcanvas.height);
  if (trail.length < 2) return;
  tctx.scale(tdpr, tdpr);
  tctx.globalCompositeOperation='lighter';   // additive: overlapping puffs melt into a smooth glow

  // soft vapour body — each point is a radial puff that blooms outward as it ages, like dispersing smoke
  for (let i=0;i<trail.length;i++){
    const b=trail[i];
    const life=1-(curU-b.u)/TRAIL_SPAN; if(life<=0||b.op<=0) continue;
    const age=1-life;
    const R=9 + 46*age + 9*life;              // tight at the plane, billows wide behind
    const a=0.10*Math.pow(life,1.25)*b.op;
    const g=tctx.createRadialGradient(b.x,b.y,0, b.x,b.y,R);
    g.addColorStop(0.0,`rgba(150,135,240,${a})`);
    g.addColorStop(0.45,`rgba(150,135,240,${a*0.40})`);
    g.addColorStop(1.0,'rgba(150,135,240,0)');
    tctx.fillStyle=g; tctx.beginPath(); tctx.arc(b.x,b.y,R,0,6.2832); tctx.fill();
  }
  // warm inner glow, tighter and brighter, hugging the recent path
  for (let i=0;i<trail.length;i++){
    const b=trail[i];
    const life=1-(curU-b.u)/TRAIL_SPAN; if(life<=0||b.op<=0) continue;
    const R=5 + 16*life;
    const a=0.22*Math.pow(life,2.2)*b.op;
    const g=tctx.createRadialGradient(b.x,b.y,0, b.x,b.y,R);
    g.addColorStop(0.0,`rgba(200,190,255,${a})`);
    g.addColorStop(1.0,'rgba(200,190,255,0)');
    tctx.fillStyle=g; tctx.beginPath(); tctx.arc(b.x,b.y,R,0,6.2832); tctx.fill();
  }
  // hot white spark right at the plane
  for (let i=0;i<trail.length;i++){
    const b=trail[i];
    const life=1-(curU-b.u)/TRAIL_SPAN; if(life<=0||b.op<=0) continue;
    const R=3 + 7*life*life;
    const a=0.5*Math.pow(life,4)*b.op;
    const g=tctx.createRadialGradient(b.x,b.y,0, b.x,b.y,R);
    g.addColorStop(0.0,`rgba(235,232,255,${a})`);
    g.addColorStop(1.0,'rgba(235,232,255,0)');
    tctx.fillStyle=g; tctx.beginPath(); tctx.arc(b.x,b.y,R,0,6.2832); tctx.fill();
  }
  tctx.globalCompositeOperation='source-over';
}

const W = window.innerWidth, H = window.innerHeight;
const P = { x: W/2, y: H/2 };                       // loop is centred on screen centre
const r = Math.min(W, H) * 0.18;                    // loop radius
const Lc = 2 * Math.PI * r;                          // loop arc length

const S    = Math.SQRT1_2;
const d    = { x: S, y: -S };                       // heading: up-right (y is down)
const dDeg = Math.atan2(d.y, d.x) * 180 / Math.PI;  // -45deg
const ART_OFFSET = 45;                              // mark art naturally points up-right

// short straight run-in / run-out so the plane enters and leaves through the visible corners
const La = Lc * 0.82;                                // approach length
const Le = Lc * 0.75;                                // exit length
const p0    = { x: P.x - d.x*La, y: P.y - d.y*La }; // just off bottom-left corner
const pExit = { x: P.x + d.x*Le, y: P.y + d.y*Le }; // just off top-right corner

// loop: perfect circle, tangent to the diagonal at P on both ends. loopDir -1 = nose UP & over.
const psi0    = Math.atan2(d.y, d.x);               // start heading = diagonal
const loopDir = -1;
const w       = loopDir * 2 * Math.PI;
const Cw      = r / loopDir;                         // C/omega, sets the circle geometry
function loopPos(s){
  const psi = psi0 + w*s;
  return { x: P.x + Cw*(Math.sin(psi) - Math.sin(psi0)),
           y: P.y + Cw*(Math.cos(psi0) - Math.cos(psi)) };
}
function loopHeadingDeg(s){ return (psi0 + w*s) * 180 / Math.PI; }

const T = La + Lc + Le;                              // total arc length
const lerp = (a,b,t)=>({ x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t });
function smoothstep(a,b,x){ x=Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); }

// --- speed profile over linear time u: soft launch, savour the loop (mid dip), graceful glide-out ---
function speed(u){
  const rampIn  = smoothstep(0.00, 0.12, u);        // quick, gentle launch
  const rampOut = 1 - 0.55*smoothstep(0.62, 1.00, u); // gently keep drifting out as it fades
  const loopDip = 0.36 * Math.exp(-Math.pow((u-0.46)/0.16, 2)); // slow through the loop
  return (0.16 + 0.84*rampIn) * rampOut * (1 - loopDip);
}
// integrate speed -> cumulative arc-length table, so u maps to an eased fraction of the path
const N = 800, cum = new Float64Array(N+1);
for (let i=1;i<=N;i++){
  const u0=(i-1)/N, u1=i/N;
  cum[i] = cum[i-1] + 0.5*(speed(u0)+speed(u1))*(1/N);
}
const cumTotal = cum[N];
function arclenFrac(u){
  const x=Math.min(1,Math.max(0,u))*N, i=Math.floor(x), f=x-i;
  const c = i>=N ? cum[N] : cum[i]+(cum[i+1]-cum[i])*f;
  return c/cumTotal;
}

function render(u){
  const sArc = arclenFrac(u) * T;
  let pos, headingDeg;
  if (sArc < La){                                    // approach (straight)
    pos = lerp(p0, P, sArc/La); headingDeg = dDeg;
  } else if (sArc < La + Lc){                         // loop (circle)
    const s=(sArc-La)/Lc; pos = loopPos(s); headingDeg = loopHeadingDeg(s);
  } else {                                            // exit (straight)
    pos = lerp(P, pExit, (sArc-La-Lc)/Le); headingDeg = dDeg;
  }

  // gentle air buoyancy: sway perpendicular to travel, faded to zero inside the loop
  const headRad = headingDeg * Math.PI / 180;
  const perp = { x: -Math.sin(headRad), y: Math.cos(headRad) };
  const distP = Math.hypot(pos.x - P.x, pos.y - P.y);
  const ampScale = smoothstep(r*1.3, r*3.2, distP);   // 0 near the loop, 1 out on the straights
  const sway = Math.sin(u * 34) * 3.0 * ampScale;
  pos = { x: pos.x + perp.x*sway, y: pos.y + perp.y*sway };

  const opacity = smoothstep(0.00, 0.07, u) * (1 - smoothstep(0.72, 0.92, u));
  const scale   = (0.88 + 0.12*smoothstep(0.00,0.14,u))   // grow in as it arrives
                * (1 - 0.42*smoothstep(0.60,0.95,u));      // shrink and dissolve into the distance

  // feed the contrail, then trim expired points
  trail.push({ x:pos.x, y:pos.y, u, op:opacity });
  while (trail.length && u - trail[0].u > TRAIL_SPAN) trail.shift();
  drawTrail(u);

  gsap.set(plane, {
    x:pos.x, y:pos.y, xPercent:-50, yPercent:-50,
    rotation: headingDeg + ART_OFFSET, scale, opacity
  });
}

if (!gsap){
  stage.style.visibility='visible';
  plane.style.opacity='1';
  plane.style.transform=`translate(${P.x}px,${P.y}px) translate(-50%,-50%)`;
} else if (reduce){
  stage.style.visibility='visible';
  gsap.set(plane,{ x:P.x, y:P.y, xPercent:-50, yPercent:-50, opacity:1 });
} else {
  gsap.set(stage,{ visibility:'visible' });
  render(0);
  const drive = { u:0 };
  const seekT = new URLSearchParams(location.search).get('t');
  const noNav = seekT !== null || jumpToEnd || location.search.indexOf('stay') > -1;

  // NOTE: the real app flow lives in home.html (splash overlay + home in one page).
  // This file is the isolated splash for reviewing/tuning the animation only.
  const tl = gsap.timeline();
  tl.to(drive, { u:1, duration:2.9, ease:'none', onUpdate:()=>render(drive.u) }, 0);

  if (seekT !== null){
    const target = parseFloat(seekT), steps = Math.max(1, Math.round(target*60));
    for (let i=0;i<=steps;i++) tl.time(target*i/steps);     // replay so the trail history exists
    tl.pause();
  } else if (jumpToEnd){ tl.time(2.0).pause(); }
}
</script>
</body>
